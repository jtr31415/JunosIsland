name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build both artifacts
        run: npm run build

      # The 2D game is opened from disk, so its build must have no external
      # references at all. Fail loudly here rather than on Juno's tablet.
      - name: Assert the words build is fully inlined
        run: |
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('dist/words/junos-words.html', 'utf8');
          const m = h.match(/(src|href)=\"(?!data:|https?:|#)[^\"]+\"/g);
          if (m) { console.error('External refs in single-file build: ' + m.join(', ')); process.exit(1); }
          console.log('words build is fully inlined');
          "

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r dist/island/* _site/
          mkdir -p _site/words
          cp dist/words/junos-words.html _site/words/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
