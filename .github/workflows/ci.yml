name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The parity soak only. Nightly rather than per-push: it takes minutes, and
  # a gate that slows every commit is a gate people route around.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Not on the nightly tick: that exists for the soak below, and rebuilding
    # would redeploy Pages every night for nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build both artifacts
        run: npm run build

      # The 2D game is opened from disk, so its build must have no external
      # references at all. Fail loudly here rather than on Juno's tablet.
      - name: Assert the words build is fully inlined
        run: |
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('dist/words/junos-words.html', 'utf8');
          const m = h.match(/(src|href)=\"(?!data:|https?:|#)[^\"]+\"/g);
          if (m) { console.error('External refs in single-file build: ' + m.join(', ')); process.exit(1); }
          console.log('words build is fully inlined');
          "

      # Proves the ARTIFACT boots and renders, not just that the modules pass
      # their unit tests. Half of M0's integration proof; the manual parity
      # check against v0/junos-words.html is the other half.
      - name: Boot smoke test
        run: npm run smoke

      # Boots the frozen original AND the rebuild under one seed and diffs the
      # rendered play area at every step. This is the machine half of "plays
      # identically"; a human still has to judge feel, sound and animation.
      - name: Parity against the frozen original
        run: npm run parity

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r dist/island/* _site/
          mkdir -p _site/words
          cp dist/words/junos-words.html _site/words/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Item 3's acceptance: fifty consecutive green parity runs.
  #
  # The gate flaked once — four steps differing, then four clean runs — and a
  # gate that fails at random is a gate people stop reading. The cause was two
  # jsdom instances on real timers being snapshotted on a fixed sleep, so one
  # could be read mid-settle; parity.mjs now waits for each to go quiet on its
  # own. The only way to know that worked is to fail to reproduce it a lot of
  # times in a row.
  #
  # Its own job, so a slow proof never blocks a deploy.
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fifty consecutive parity runs
        run: npm run parity:soak

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
