<!doctype html>
<!-- JOE_WORKBENCH_ONLY — the asset viewer. Dev-only; see tools/smoke/channel.mjs. -->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assets — Workbench</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <header>
    <a class="back" href="/">← bench</a>
    <nav id="galleries">
      <button data-gallery="built" class="on">Built animals</button>
      <!--
        The primitives sign-off. PB-036 phase 4, and it sits SECOND rather than
        last because nothing on the Built animals tab may be re-tuned until the
        primitive it rides on has been ticked here.
      -->
      <button data-gallery="primitives">Primitives</button>
      <button data-gallery="species">Species</button>
      <button data-gallery="tiles">Tiles</button>
      <button data-gallery="props">Props</button>
    </nav>
    <input id="search" placeholder="search ids…" autocomplete="off">
    <span id="count" class="meta"></span>
    <span id="says" class="meta"></span>
  </header>

  <!--
    Where he has got to, across the WHOLE bench, always on screen.

    Joe asked for it in the same breath as the sign-off — "i then sign them off
    one by one and you show me the progress in the viewer" — so it sits above
    the three panes rather than inside the one he happens to be looking at, and
    it never describes only what is filtered onto the screen.
  -->
  <div id="bench" hidden>
    <progress id="benchBar" value="0" max="1"></progress>
    <strong id="benchDone">—</strong>
    <span id="benchMeta" class="meta"></span>
  </div>

  <div id="layout">
    <aside id="rail"><ul id="list"></ul></aside>

    <main>
      <canvas id="stage"></canvas>
      <div id="controls" class="row">
        <label id="setPick" hidden>Set <select id="setSelect"></select></label>
        <label id="seasonPick" hidden>Season <select id="seasonSelect">
          <option>base</option><option selected>Summer</option><option>Fall</option><option>Winter</option>
        </select></label>
        <label id="greyPick" hidden><input type="checkbox" id="greyToggle"> grey atlas</label>
        <button id="spin">pause spin</button>
        <button id="reset">reset view</button>
        <button id="grid">grid this group</button>
      </div>
      <p id="hint" class="meta">drag to orbit · wheel to zoom · ↑ ↓ to page · space to stop spinning</p>
    </main>

    <aside id="detail">
      <h2 id="assetId">—</h2>
      <dl id="facts"></dl>

      <!--
        One creature's whole bench, and ONE gate over it.

        JT-031, in his words: "have an agent create the facts and fact check
        them. they then become part of my final sign off for each animal along
        with its name." So the fact and the name sit above a single Sign off
        button, and the two strike buttons beside them are not second gates —
        they are how he says "the model and the name are fine, the sentence is
        not" without having to write a paragraph about it.

        Built by hand in `viewer.ts` rather than declared here, because every
        control on it has to know which creature it is patching.
      -->
      <section id="creature" hidden></section>

      <!--
        One PRIMITIVE, and one gate over it.

        Joe: "i'd like to sign off the primitives to be used first." So the row
        is the argument laid out in the order it has to be read — the question,
        what the pack measures, what the kits do, the gap, the proposal, the
        provenance — with accept and refuse beneath it. Refuse is a real answer
        and is not the absence of one, so it has its own button rather than being
        expressed by not clicking.

        Built by hand in `viewer.ts` rather than declared here, because every
        control on it has to know which row it is patching.
      -->
      <section id="primitive" hidden></section>

      <form id="noteForm">
        <textarea name="note" rows="3" placeholder="what is wrong with it" required></textarea>
        <button type="submit">Add note for this asset</button>
      </form>
      <ul id="notes"></ul>
    </aside>
  </div>

  <script type="module" src="/viewer.ts"></script>
</body>
</html>
