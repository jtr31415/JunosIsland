<!doctype html>
<!-- JOE_WORKBENCH_ONLY — the asset viewer. Dev-only; see tools/smoke/channel.mjs. -->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assets — Workbench</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <header>
    <a class="back" href="/">← bench</a>
    <nav id="galleries">
      <!--
        THE LIVE METHOD, and it sits first because it is the one that is not
        scrapped. An animal here is assembled at runtime out of geometry lifted
        from the 24 original Kenney files (docs/building-animals-from-parts.md)
        and always stands BESIDE a real pack animal, because the question the
        method has to answer is whether it "sits next to the fox without looking
        like a guest" — which is a question about a pair, not about an animal.

        The captions on this tab and the next are `NEW_METHOD_TAB` and
        `SCRAPPED_TAB` in `assembled.ts`, and a test asserts the HTML still says
        both. Two tabs of animals with no word about which one is superseded is
        precisely the confusion the labelling requirement exists to prevent.
      -->
      <button data-gallery="assembled">Assembled — NEW</button>
      <button data-gallery="built" class="on">Kit builds — SCRAPPED</button>
      <!--
        The primitives sign-off. PB-036 phase 4, and it sits SECOND rather than
        last because nothing on the kit-builds tab may be re-tuned until the
        primitive it rides on has been ticked here.
      -->
      <button data-gallery="primitives">Primitives</button>
      <!--
        One pack animal taken apart, with a label against every piece. Joe:
        "i need one example of an original animal, ripped apart in the viewer
        with a label against each part." It sits beside Primitives because it is
        the evidence those rows are argued from — head = body, and all eyes are
        flat, measured off the file rather than read off a screenshot.
      -->
      <button data-gallery="anatomy">Anatomy</button>
      <button data-gallery="species">Species</button>
      <button data-gallery="tiles">Tiles</button>
      <button data-gallery="props">Props</button>
    </nav>
    <input id="search" placeholder="search ids…" autocomplete="off">
    <span id="count" class="meta"></span>
    <span id="says" class="meta"></span>
  </header>

  <!--
    Where he has got to, across the WHOLE bench, always on screen.

    Joe asked for it in the same breath as the sign-off — "i then sign them off
    one by one and you show me the progress in the viewer" — so it sits above
    the three panes rather than inside the one he happens to be looking at, and
    it never describes only what is filtered onto the screen.
  -->
  <div id="bench" hidden>
    <progress id="benchBar" value="0" max="1"></progress>
    <strong id="benchDone">—</strong>
    <span id="benchMeta" class="meta"></span>
  </div>

  <div id="layout">
    <aside id="rail"><ul id="list"></ul></aside>

    <main>
      <canvas id="stage"></canvas>
      <!--
        The labels, drawn as HTML over the canvas rather than as 3D text.

        Projected from each part's world centroid every frame. HTML because a
        label has to stay readable — upright, one size, selectable — and 3D text
        does none of those things while the camera is anywhere but head-on.
        Filled by `viewer.ts`; empty and inert for every other gallery.
      -->
      <div id="labels" aria-hidden="true"></div>
      <div id="controls" class="row">
        <label id="setPick" hidden>Set <select id="setSelect"></select></label>
        <label id="seasonPick" hidden>Season <select id="seasonSelect">
          <option>base</option><option selected>Summer</option><option>Fall</option><option>Winter</option>
        </select></label>
        <label id="greyPick" hidden><input type="checkbox" id="greyToggle"> grey atlas</label>
        <!--
          The anatomy pair, and they are the whole interaction. A species, and
          one slider from assembled to fully apart — nothing else, because
          anything else would be a second thing to read while trying to read the
          animal. The 24 are filled in from `ANATOMY_SPECIES` by `viewer.ts`.
        -->
        <label id="anatomyPick" hidden>Animal <select id="speciesSelect"></select></label>
        <!--
          WHICH ORIGINAL THE NEW ANIMAL STANDS BESIDE.

          Defaulted to `animal-fox` by `DEFAULT_REFERENCE`, because the sentence
          the method is judged against names the fox specifically. The other 23
          are here because "does it look like a guest" has a different answer
          beside a panda than beside a bee, and he should be able to ask both.
          Filled from `REFERENCE_ANIMALS` by `viewer.ts` so the list cannot fall
          behind what is on disk.
        -->
        <label id="besidePick" hidden>Beside <select id="besideSelect"></select></label>
        <label id="explodePick" hidden>
          Explode <input type="range" id="explodeRange" min="0" max="1" step="0.01" value="0.55">
          <span id="explodeValue" class="meta">0.55</span>
        </label>
        <button id="spin">pause spin</button>
        <button id="reset">reset view</button>
        <button id="grid">grid this group</button>
      </div>
      <p id="hint" class="meta">drag to orbit · wheel to zoom · ↑ ↓ to page · space to stop spinning</p>
    </main>

    <aside id="detail">
      <h2 id="assetId">—</h2>
      <dl id="facts"></dl>

      <!--
        One creature's whole bench, and ONE gate over it.

        JT-031, in his words: "have an agent create the facts and fact check
        them. they then become part of my final sign off for each animal along
        with its name." So the fact and the name sit above a single Sign off
        button, and the two strike buttons beside them are not second gates —
        they are how he says "the model and the name are fine, the sentence is
        not" without having to write a paragraph about it.

        Built by hand in `viewer.ts` rather than declared here, because every
        control on it has to know which creature it is patching.
      -->
      <section id="creature" hidden></section>

      <!--
        One PRIMITIVE, and one gate over it.

        Joe: "i'd like to sign off the primitives to be used first." So the row
        is the argument laid out in the order it has to be read — the question,
        what the pack measures, what the kits do, the gap, the proposal, the
        provenance — with accept and refuse beneath it. Refuse is a real answer
        and is not the absence of one, so it has its own button rather than being
        expressed by not clicking.

        Built by hand in `viewer.ts` rather than declared here, because every
        control on it has to know which row it is patching.
      -->
      <section id="primitive" hidden></section>

      <!--
        The same parts as the labels on the canvas, as a list you can read down.

        The canvas answers "where is it"; this answers "how big is it, and who
        named it". Both are built from one array in `viewer.ts`, so they cannot
        disagree about a part.
      -->
      <section id="anatomy" hidden></section>

      <!--
        One animal built under the NEW method, and what it is standing beside.

        It carries the method's own label at the top rather than at the bottom,
        so the first thing read on this pane is which of the two kinds of animal
        is on the turntable. If the build raised a flag it goes here too, as a
        note rather than an alarm — the escape clause is the method working, and
        a flag Joe cannot see is worse than useless.

        Built by hand in `viewer.ts`; the strings come from `assembled.ts` so the
        list, the card and the labels over the canvas cannot word it differently.
      -->
      <section id="assembled" hidden></section>

      <form id="noteForm">
        <textarea name="note" rows="3" placeholder="what is wrong with it" required></textarea>
        <button type="submit">Add note for this asset</button>
      </form>
      <ul id="notes"></ul>
    </aside>
  </div>

  <script type="module" src="/viewer.ts"></script>
</body>
</html>
