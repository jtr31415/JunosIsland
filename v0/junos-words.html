<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Juno's Words &amp; Numbers</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;touch-action:manipulation}
  body{
    /* Rounded infant-style letterforms (single-storey a) — deliberate for early readers */
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Arial Rounded MT Bold",sans-serif;
    user-select:none;-webkit-user-select:none;cursor:pointer;
  }

  #scene{position:fixed;inset:0;overflow:hidden;transition:background 1s ease}

  /* ---------- OCEAN ---------- */
  body.ocean #scene{background:linear-gradient(180deg,#4fc3e8 0%,#1878b4 45%,#0a3a6b 100%)}
  .bubble{position:absolute;bottom:-90px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.12) 60%,rgba(255,255,255,.03));
    animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh)}}

  /* ---------- SPACE ---------- */
  body.space #scene{background:radial-gradient(120% 100% at 50% 115%,#3b2178 0%,#191046 45%,#05020f 100%)}
  .star{position:absolute;background:#fff;border-radius:50%;pointer-events:none;
    animation:twinkle ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  /* ---------- UNICORN FOREST ---------- */
  body.unicorn #scene{background:linear-gradient(180deg,#ffc2e2 0%,#c79bf2 55%,#4a2d73 100%)}
  .heart{position:absolute;bottom:-70px;pointer-events:none;animation:rise linear infinite}
  .heart>span{display:inline-block;animation:sway ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  .sparkle{position:absolute;pointer-events:none;animation:twinkle ease-in-out infinite alternate}
  .decor{position:absolute;bottom:-8px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(20,10,40,.35))}

  /* ---------- GARDEN ---------- */
  body.garden #scene{background:linear-gradient(180deg,#9fdcf7 0%,#cdeeb6 55%,#57a05a 80%,#2f6b3a 100%)}
  .petal{position:absolute;top:-70px;pointer-events:none;animation:fall linear infinite}
  .petal>span{display:inline-block;animation:sway ease-in-out infinite alternate}
  @keyframes fall{to{transform:translateY(118vh)}}
  .fixed-decor{position:absolute;pointer-events:none}

  /* ---------- HALLOWEEN ---------- */
  body.halloween #scene{background:linear-gradient(180deg,#241640 0%,#4a2570 55%,#120a24 100%)}

  /* ---------- CHRISTMAS ---------- */
  body.christmas #scene{background:linear-gradient(180deg,#16324f 0%,#274f77 55%,#dfeefa 80%,#cfe4f5 100%)}

  /* ---------- SUMMER HOLIDAY ---------- */
  body.summer #scene{background:linear-gradient(180deg,#8fd6f9 0%,#5fc0ea 50%,#2aa0d0 52%,#1e8fc2 70%,#f2d59b 72%,#e8c684 100%)}

  /* ---------- CRITTERS ---------- */
  .critter{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;
    animation:swim linear infinite}
  .critter>span{display:inline-block;animation:bob 3.4s ease-in-out infinite alternate}
  @keyframes swim{from{transform:translateX(108vw)}to{transform:translateX(-18vw)}}
  @keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(8px)}}

  /* ---------- WORDS ---------- */
  #words{position:fixed;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
    gap:2.4vmin 2.8vmin;padding:20vmin 5vmin 24vmin;pointer-events:none}
  #words.nudge{animation:nudge .3s ease-out}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(2.2vmin)}}
  .word{background:rgba(255,255,255,.95);border-radius:.55em;padding:.26em .55em .3em;
    font-weight:700;font-size:var(--ws,12vmin);line-height:1.15;
    box-shadow:0 .35em 1em rgba(0,0,20,.3);
    animation:pop .55s cubic-bezier(.34,1.6,.64,1) both, floaty 3.2s ease-in-out infinite alternate}
  .word.green{color:#118a2f}
  .word.red{color:#e2362b}
  /* wavy = the tricky bit that breaks the rules; solid = a digraph/trigraph (one sound) */
  .word .tk{text-decoration:underline wavy;text-decoration-thickness:.06em;text-underline-offset:.16em}
  .word .di{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.16em}
  .word.found{opacity:.45;scale:.88;outline:.4vmin solid #ffd166;
    transition:opacity .35s,scale .35s}
  @keyframes pop{from{transform:scale(0) rotate(var(--rot,0deg))}to{transform:scale(1) rotate(var(--rot,0deg))}}
  @keyframes floaty{from{translate:0 -0.6vmin}to{translate:0 0.6vmin}}

  /* ---------- MATHS ---------- */
  #words.maths{display:grid;grid-template-columns:repeat(5,max-content);
    justify-content:center;align-content:center;align-items:center;justify-items:center;
    column-gap:2.6vmin;row-gap:3vmin}
  .word.blue{color:#2456c4}
  .word.mystery{color:#97a0ac}
  .op{color:#fff;font-weight:700;font-size:calc(var(--ws) * .85);
    text-shadow:0 2px 8px rgba(0,0,20,.55);pointer-events:none}
  .helper{pointer-events:auto;cursor:pointer}
  .qchip{width:9.5vmin;height:9.5vmin;min-width:36px;min-height:36px;border-radius:50%;
    background:rgba(255,255,255,.92);color:#7a3fb8;font-weight:700;
    font-size:max(5vmin,20px);display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,20,.3);animation:pop .4s cubic-bezier(.34,1.6,.64,1) both}
  .dotbox{background:rgba(255,255,255,.94);border-radius:1.6vmin;padding:1.8vmin;
    display:grid;grid-template-columns:repeat(5,auto);gap:1.2vmin;
    box-shadow:0 3px 10px rgba(0,0,20,.3);animation:pop .35s cubic-bezier(.34,1.6,.64,1) both}
  .dot{width:2.6vmin;height:2.6vmin;min-width:10px;min-height:10px;border-radius:50%}
  .dot.o{background:#ff8c42}
  .dot.b{background:#2456c4}
  .numpad{display:flex;flex-direction:column;align-items:center;gap:1.6vmin;pointer-events:none}
  .zrow{display:flex}
  .tgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:.9vmin;width:min(94vw,560px)}
  .nchip{pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;
    aspect-ratio:1;min-height:30px;border-radius:1.4vmin;font-weight:700;
    font-size:clamp(13px,3.6vmin,21px);
    box-shadow:0 2px 6px rgba(0,0,20,.22);
    animation:pop .4s cubic-bezier(.34,1.6,.64,1) both}
  .nchip.zero{width:clamp(38px,9vmin,50px);background:#e8ebef;color:#5d6a78}
  .nchip.five-a{background:#ffe6d2;color:#b8560f}
  .nchip.five-b{background:#dbe7fb;color:#2456c4}
  .nchip.hit{background:#118a2f !important;color:#fff !important}
  .numpad.done .nchip:not(.hit){opacity:.45}

  /* ---------- WORD BUILDING ---------- */
  #words.build{display:flex;flex-direction:column;flex-wrap:nowrap;
    justify-content:center;align-items:center;gap:5vmin}
  .slotrow{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
  .slot{min-width:11vmin;height:13vmin;min-height:54px;padding:0 1.6vmin;
    border-radius:1.6vmin;border:.55vmin dashed rgba(255,255,255,.75);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    font-size:clamp(26px,8.5vmin,52px);color:#118a2f;background:rgba(255,255,255,.15)}
  .slot.filled{background:rgba(255,255,255,.95);border-style:solid;border-color:transparent;
    box-shadow:0 .3em .8em rgba(0,0,20,.3);animation:pop .35s cubic-bezier(.34,1.6,.64,1)}
  .tray{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;max-width:92vw}
  .tile{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.95);
    border-radius:1.6vmin;padding:1.2vmin 2.6vmin;font-weight:700;
    font-size:clamp(24px,7.5vmin,44px);color:#2456c4;
    box-shadow:0 .3em .8em rgba(0,0,20,.3);
    animation:pop .45s cubic-bezier(.34,1.6,.64,1) both}
  .tile.used{opacity:.25;pointer-events:none}
  .di2{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.14em}

  /* ---------- HUD ---------- */
  #hudLeft,#hudRight{position:fixed;top:calc(14px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:10px;z-index:10;pointer-events:none}
  #hudLeft{left:calc(14px + env(safe-area-inset-left))}
  #hudRight{right:calc(14px + env(safe-area-inset-right));align-items:flex-end}
  .hudrow{display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
  #themes{max-width:238px}
  .hudrow button{pointer-events:auto;cursor:pointer;border:none;width:52px;height:52px;border-radius:50%;
    font-size:26px;line-height:1;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);
    box-shadow:0 4px 12px rgba(0,0,20,.25);transition:transform .15s,background .3s}
  .hudrow button:active{transform:scale(.88)}
  .hudrow button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .hudrow button.on{background:rgba(255,255,255,.92);
    box-shadow:0 0 0 3px rgba(255,255,255,.55),0 4px 12px rgba(0,0,20,.3)}
  .hudrow button.lvl{font-family:inherit;font-weight:700;font-size:24px;color:#4a2d73}
  .hide{display:none !important}
  @media (max-width:430px){
    .hudrow{gap:8px}
    #hudLeft,#hudRight{gap:8px}
    #themes{max-width:208px}
    .hudrow button{width:46px;height:46px;font-size:23px}
    .hudrow button.lvl{font-size:21px}
  }

  #footer{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10;pointer-events:none}
  #targetCard{background:rgba(255,255,255,.95);color:#555;padding:6px 18px;border-radius:16px;
    font-size:20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,20,.3);
    animation:pop .4s cubic-bezier(.34,1.6,.64,1) both}
  #targetCard b{font-size:28px;color:#222}
  .sayrow{display:flex;gap:12px}
  #btnSay,#btnFred{pointer-events:auto;cursor:pointer;border:none;width:64px;height:64px;border-radius:50%;
    font-size:30px;line-height:1;background:rgba(255,255,255,.92);
    box-shadow:0 6px 16px rgba(0,0,20,.35);transition:transform .15s}
  #btnSay:active,#btnFred:active{transform:scale(.86)}
  .slot.fredhl{animation:fredpulse .6s ease;border-color:#ffd166 !important;
    background:rgba(255,230,160,.55) !important}
  @keyframes fredpulse{0%,100%{scale:1}50%{scale:1.14}}
  #score{position:relative;overflow:hidden;background:rgba(0,0,20,.28);backdrop-filter:blur(4px);color:#fff;
    font-size:21px;font-weight:700;padding:6px 20px 8px;border-radius:999px;
    text-shadow:0 1px 3px rgba(0,0,0,.4)}
  #statusRow{display:flex;gap:10px;align-items:stretch}
  #battery{display:flex;align-items:center;gap:8px;background:rgba(0,0,20,.28);backdrop-filter:blur(4px);
    padding:6px 14px;border-radius:999px}
  #battIcon{position:relative;width:44px;height:20px;border:2.5px solid #fff;border-radius:5px;display:block}
  #battIcon::after{content:'';position:absolute;right:-7px;top:3px;width:5px;height:8px;
    background:#fff;border-radius:0 2px 2px 0}
  #battFill{position:absolute;left:2px;top:2px;bottom:2px;border-radius:2px;
    background:#57d06a;transition:width .35s,background .35s}
  #battNum{color:#fff;font-size:19px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  #battery.pulse{animation:battpulse .45s ease}
  @keyframes battpulse{0%,100%{scale:1}50%{scale:1.15}}
  #legend{display:flex;gap:16px;font-size:15px;color:#fff;
    background:rgba(0,0,20,.28);padding:6px 16px;border-radius:999px}
  #legend .g{color:#8dffab;font-weight:700}
  #legend .r{color:#ffb3ad;font-weight:700;text-decoration:underline wavy;text-underline-offset:3px}
  #hint{color:rgba(255,255,255,.92);font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.45);
    animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  #toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);z-index:30;background:rgba(0,0,20,.78);color:#fff;
    padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;
    transition:opacity .4s;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1}

  #fx{position:fixed;inset:0;z-index:6;pointer-events:none}
  .spectChar{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:none;
    line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,30,.4));will-change:transform}
  #banner{position:fixed;top:30%;left:50%;translate:-50% -50%;z-index:7;pointer-events:none;
    font-weight:700;font-size:9vmin;color:#fff;white-space:nowrap;opacity:0;
    text-shadow:0 3px 14px rgba(0,0,20,.55),0 0 26px rgba(255,255,255,.35)}
  #banner.show{animation:bannerIn 3.2s ease forwards}
  @keyframes bannerIn{0%{opacity:0;scale:.4}12%{opacity:1;scale:1.06}22%{scale:1}78%{opacity:1}100%{opacity:0}}

  /* ---------- EGG / COLLECTION ---------- */
  #egg{position:relative;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
  #eggRing{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(#ffd166 var(--eggpct,0%), rgba(255,255,255,.22) 0)}
  #eggRing::after{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(0,0,20,.45)}
  #eggEmoji{position:relative;font-size:22px;line-height:1;
    animation:eggwob var(--wob,3s) ease-in-out infinite}
  @keyframes eggwob{0%,100%{rotate:0deg}25%{rotate:-10deg}75%{rotate:10deg}}
  .visitor{position:fixed;z-index:5;pointer-events:auto;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 10px rgba(0,0,30,.4))}
  .visitor>span{display:inline-block;font-size:52px;animation:bob 2.6s ease-in-out infinite alternate}
  .visitor .vs{position:absolute;font-size:16px;animation:twinkle 1.4s ease-in-out infinite alternate}
  #hatchCard{position:fixed;top:46%;left:50%;translate:-50% -50%;z-index:30;pointer-events:none;
    display:none;flex-direction:column;align-items:center;gap:1vmin;
    filter:drop-shadow(0 8px 22px rgba(0,0,30,.5))}
  #hatchCard.show{display:flex;animation:pop .6s cubic-bezier(.34,1.6,.64,1) both}
  #hatchEmoji{font-size:22vmin;line-height:1}
  #hatchName{color:#fff;font-weight:700;font-size:6.5vmin;text-shadow:0 2px 10px rgba(0,0,20,.6)}
  #book{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,12,28,.6);
    backdrop-filter:blur(5px);overflow:auto;padding:18px;cursor:default}
  #book.open{display:block}
  .bkCard{max-width:640px;margin:0 auto;background:#fff;border-radius:18px;padding:18px;
    box-shadow:0 10px 40px rgba(0,0,20,.4)}
  .bkTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .bkTop h2{font-size:20px;color:#1c2530;margin:0}
  #bkCount{font-weight:700;color:#5c6a7a}
  #bkClose{border:none;background:#eef1f4;border-radius:50%;width:40px;height:40px;
    font-size:18px;font-weight:700;cursor:pointer;color:#333}
  .bkHd{font-weight:700;color:#1c2530;margin:14px 0 6px;font-size:16px;text-transform:capitalize}
  .bkGridSec{display:flex;flex-wrap:wrap;gap:8px}
  .stk{width:62px;height:70px;border-radius:12px;background:#f3f6f9;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .stk .se{font-size:30px;line-height:1}
  .stk .sn{font-size:10px;color:#5c6a7a;font-weight:600}
  .stk.mys .se{filter:brightness(0);opacity:.28}
  .stk.mys .sn{visibility:hidden}

  /* ---------- PLAYERS ---------- */
  #whoBtn{pointer-events:auto;cursor:pointer;width:44px;height:44px;border-radius:50%;
    border:none;background:rgba(255,255,255,.92);font-size:23px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,20,.3)}
  #whoBtn:active{transform:scale(.9)}
  #profiles{position:fixed;inset:0;z-index:45;display:none;background:rgba(8,12,28,.6);
    backdrop-filter:blur(5px);overflow:auto;padding:18px;cursor:default}
  #profiles.open{display:block}
  .pkTitle{color:#1c2530;font-size:20px;margin:0 0 12px}
  .pgrid{display:flex;flex-wrap:wrap;gap:12px}
  .pcard{width:112px;height:124px;border-radius:16px;background:#f3f6f9;border:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;font-family:inherit}
  .pcard:active{transform:scale(.95)}
  .pcard .pav{font-size:44px;line-height:1}
  .pcard .pnm{font-size:14px;font-weight:700;color:#1c2530}
  .pcard.now{outline:3px solid #57d06a}
  .pcard.add{border:3px dashed #c3ccd6;background:#fff;color:#5c6a7a;font-weight:700}
  .avgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .avpick{width:58px;height:58px;border-radius:14px;border:none;background:#f3f6f9;
    font-size:30px;cursor:pointer}
  .avpick:active{transform:scale(.9)}

  .spark{position:fixed;border-radius:50%;pointer-events:none;z-index:5}

  @media (prefers-reduced-motion:reduce){
    .bubble,.star,.critter,.critter>span,.heart,.heart>span,.sparkle,.petal,.petal>span,#hint{animation:none}
    .word,.qchip,.dotbox,.nchip,.tile,.slot.filled,#targetCard{animation:pop .001s both}
  }
</style>
</head>
<body class="ocean">

<div id="scene">
  <div id="ambience"></div>
  <div id="words"></div>
</div>
<canvas id="fx"></canvas>
<div id="banner"></div>

<div id="hudLeft">
  <div class="hudrow" id="themes">
    <button id="btnOcean" class="on" title="Under the sea">🌊</button>
    <button id="btnSpace" title="Outer space">🚀</button>
    <button id="btnUni" title="Unicorn forest">🦄</button>
    <button id="btnGarden" title="Garden">🌻</button>
    <button id="btnHall" title="Halloween">🎃</button>
    <button id="btnXmas" title="Christmas">🎄</button>
    <button id="btnSummer" title="Summer holiday">🏖️</button>
  </div>
  <div class="hudrow" id="modes">
    <button id="btnRead" class="on" title="Reading">🔤</button>
    <button id="btnBuild" title="Word building">🧩</button>
    <button id="btnAdd" title="Adding">➕</button>
    <button id="btnSub" title="Taking away">➖</button>
  </div>
</div>

<div id="hudRight">
  <div class="hudrow">
    <button id="btnSound" class="on" title="Sound on or off">🔊</button>
    <button id="btnReset" title="Start again">↺</button>
    <button id="btnGear" title="Grown-ups">⚙️</button>
    <button id="btnBook" title="Sticker book">📖</button>
  </div>
  <div class="hudrow" id="levels">
    <button id="btnL1" class="lvl" title="Level 1">1</button>
    <button id="btnL2" class="lvl" title="Level 2">2</button>
    <button id="btnL3" class="lvl" title="Level 3">3</button>
  </div>
</div>

<div id="footer">
  <div id="targetCard" class="hide"></div>
  <div class="sayrow">
    <button id="btnSay" title="Say it again">📢</button>
    <button id="btnFred" class="hide" title="Fred talk — sound it out">🐸</button>
  </div>
  <div id="statusRow">
    <button id="whoBtn" title="Change player">🦄</button>
    <div id="score"><span id="scoreTxt">🐚 0</span></div>
    <div id="egg" title="Next surprise"><span id="eggRing"></span><span id="eggEmoji">🥚</span></div>
    <div id="battery" title="Maths battery"><span id="battIcon"><span id="battFill"></span></span><span id="battNum">5</span></div>
  </div>
  <div id="legend"><span class="g">green = sound it out</span><span class="r">red = tricky word</span></div>
  <div id="hint">Listen, then tap the word! &middot; Tap right for new words</div>
</div>

<div id="hatchCard"><span id="hatchEmoji"></span><span id="hatchName"></span></div>

<div id="profiles">
  <div class="bkCard">
    <h2 class="pkTitle">Who's playing?</h2>
    <div class="pgrid" id="pGrid"></div>
    <div id="avWrap" class="hide">
      <h2 class="pkTitle" id="avTitle">Pick your picture!</h2>
      <div class="avgrid" id="avGrid"></div>
    </div>
  </div>
</div>

<div id="book">
  <div class="bkCard">
    <div class="bkTop">
      <h2>📖 <span id="bkWho">Juno</span>'s Sticker Book <span id="bkCount"></span></h2>
      <button id="bkClose" title="Close">✖</button>
    </div>
    <div id="bkBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   WORD LISTS — Reception / early Year 1, max 4 letters.
   Pronouns, simple verbs and function words; almost no nouns.
   Edit here. Clearly labelled so even a monkey can manage it.

   GREEN = decodable with early phonics (sound it out)
   RED   = common exception / "tricky" words (UK style)
   ============================================================ */
const GREEN = [
  'a','am','an','and','as','at','back','big','but','can','dad','did',
  'for','from','get','got','had','has','help','him','his','if','in','is',
  'it','jump','just','let','look','mum','no','not','off','on','pull',
  'push','put','ran','red','run','sat','see','sit','stop','that','them',
  'then','this','too','up','us','went','when','will','with','yes'
];
/* RED words carry [brackets] around the tricky bit — the grapheme that
   breaks the taught code. Everything outside the brackets is decodable. */
const RED = [
  '[a]ll','[are]','b[e]','b[y]','c[o]m[e]','d[o]','d[oes]','d[ow]n',
  'g[o]','hav[e]','h[e]','h[er]','h[ere]','[I]','int[o]','l[i]k[e]',
  'l[o]v[e]','m[e]','m[y]','n[ow]','o[f]','[oh]','[one]','[ou]t','s[ai]d',
  'sh[e]','s[o]','s[o]m[e]','th[e]','th[ey]','t[o]','t[wo]','w[a]nt',
  'w[a]s','w[e]','w[ere]','wh[a]t','[who]','wh[y]','y[ou]','y[our]'
];

/* Words that sound the same (or nearly the same) — never shown in the
   same batch, because a listening game with "too" AND "two" on screen
   is a trap, not a test. Extend freely. */
const CONFUSABLE = [
  ['to','too','two'],
  ['of','off'],
  ['an','and'],
  ['then','them']
];
const groupOf = {};
CONFUSABLE.forEach((g, gi) => g.forEach(w => groupOf[w] = gi));

/* ---- markup helpers: [brackets] = tricky bit; digraphs found automatically ---- */
function plainWord(str){ return str.replace(/[\[\]]/g, ''); }

function parseMark(str){
  const segs = []; let buf = '', inB = false;
  for(const ch of str){
    if(ch === '['){ if(buf) segs.push({txt:buf, k:'plain'}); buf = ''; inB = true; }
    else if(ch === ']'){ if(buf) segs.push({txt:buf, k:'tricky'}); buf = ''; inB = false; }
    else buf += ch;
  }
  if(buf) segs.push({txt:buf, k: inB ? 'tricky' : 'plain'});
  return segs;
}

/* common Reception/Y1 graphemes, longest first so trigraphs win */
const GRAPHS = ['igh','ear','air','ure',
  'ch','sh','th','wh','ph','ng','nk','qu','ck','ff','ll','ss','zz',
  'ai','ay','ee','ea','ie','oa','oo','ou','ow','oi','oy',
  'or','ar','ur','er','ir','aw','au','ew','ue','oe'];

function markDigraphs(txt){
  const out = []; let i = 0;
  outer: while(i < txt.length){
    for(const g of GRAPHS){
      if(txt.startsWith(g, i)){ out.push({txt:g, k:'di'}); i += g.length; continue outer; }
    }
    if(out.length && out[out.length - 1].k === 'plain') out[out.length - 1].txt += txt[i];
    else out.push({txt:txt[i], k:'plain'});
    i++;
  }
  return out;
}


/* ---- neighbour map: pool words one letter apart, minus sound-alike pairs ---- */
function lev1(a, b){
  if(Math.abs(a.length - b.length) > 1) return false;
  if(a.length === b.length){
    let d = 0;
    for(let i = 0; i < a.length; i++) if(a[i] !== b[i] && ++d > 1) return false;
    return d === 1;
  }
  const long = a.length > b.length ? a : b, short = a.length > b.length ? b : a;
  let i = 0, j = 0, skips = 0;
  while(i < long.length && j < short.length){
    if(long[i] === short[j]){ i++; j++; }
    else if(++skips > 1) return false;
    else i++;
  }
  return true;
}
const POOL = [
  ...GREEN.map(w => ({raw:w, cls:'green'})),
  ...RED.map(w => ({raw:w, cls:'red'}))
];
const NEIGH = {};
POOL.forEach(a => {
  const pa = plainWord(a.raw);
  NEIGH[pa] = POOL.filter(b => {
    const pb = plainWord(b.raw);
    return pa !== pb && lev1(pa, pb) &&
      !(groupOf[pa] !== undefined && groupOf[pa] === groupOf[pb]);
  });
});

/* ---- alien word generator: pronounceable non-words from taught graphemes ---- */
const AL_ONSETS = ['b','d','f','g','h','j','l','m','n','p','r','s','t','v','w','z','ch','sh','th'];
const AL_VOWELS = ['a','e','i','o','u','a','e','i','o','u','ee','oo','or'];
const AL_CODAS_SHORT = ['b','d','g','m','n','p','t','ck','ll','ss','ff','ng','sh','th'];
const AL_CODAS_LONG  = ['b','d','g','m','n','p','t','l','f'];
const REAL_BLOCK = new Set([
  ...GREEN.map(plainWord), ...RED.map(plainWord),
  'cat','dog','man','pig','sun','bed','leg','hat','pen','cup','bus','fox','zip',
  'jam','web','van','mud','rat','mat','map','top','pot','pin','bin','tin','fan',
  'fun','bug','bat','bit','ten','net','wet','pet','set','sad','lot','dot','hot',
  'gun','peg','vat','yap','nab','sob','rob','rub','rug','mug','hug','jug','tub',
  'moon','food','soon','root','boot','week','seek','peek','feed','need','seed',
  'fort','sort','port','cork','fork','ship','shop','chip','chop','chat','wish',
  'dish','fish','cash','path','bath','moth','sock','rock','lock','tick','lick',
  'kick','pick','sick','pack','sack','neck','peck','deck','duck','luck','muck',
  'suck','tuck','bell','tell','sell','fell','well','hill','fill','till','pill',
  'mill','doll','dull','mess','less','boss','loss','kiss','miss','fuss','puff',
  'huff','cuff','song','long','ring','king','sing','wing','bang','rang','hang',
  'gong','lung','sung','rung','book','took','cook','hook','good','wood','hood',
  'foot','wool','poor','door','born','corn','horn','torn','worn','form','sash',
  'mash','dash','rash','bash','fog','log','jog','dig','fig','wig','rig','jig',
  'hem','gem','rim','dim','ham','ram','yam','dam','tom','pop','mop','hop','cop',
  'cod','rod','nod','pod','gap','lap','nap','rap','sap','tap','zap','cap','lad',
  'pad','mad','fad','sup','pup','cub','nib','fib','rib','bib','pub','sum','gum',
  'hum','bun','nun','pun','won','son','ton','den','hen','men','led','fed','wed',
  'vet','jet','met','yet','bet','gut','hut','jut','nut','rut','cut','kit','fit',
  'hit','lit','wit','pit','cot','jot','rot','tot'
]);

function alienWord(){
  for(let g = 0; g < 60; g++){
    const v  = AL_VOWELS[ri(AL_VOWELS.length)];
    const on = AL_ONSETS[ri(AL_ONSETS.length)];
    const codas = v.length === 1 ? AL_CODAS_SHORT : AL_CODAS_LONG;
    const co = codas[ri(codas.length)];
    if(on === co) continue;
    const w = on + v + co;
    if(w.length > 5) continue;
    if(REAL_BLOCK.has(w)) continue;
    return w;
  }
  return 'vap';
}

let voice = null, voiceToastShown = false;

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const gb = vs.filter(v => /^en[-_]GB/i.test(v.lang));
  /* quality-ranked UK voices: Edge natural voices, then Apple, then Google */
  const pri = ['maisie','sonia','libby','ryan','arthur','martha','serena','kate',
               'daniel','stephanie','google uk english female','google uk english male'];
  gb.sort((a, b) => {
    const ai = pri.findIndex(p => a.name.toLowerCase().includes(p));
    const bi = pri.findIndex(p => b.name.toLowerCase().includes(p));
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });
  voice = gb[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(txt, rate, onend){
  if(!('speechSynthesis' in window)) return false;
  if(!voice) pickVoice();
  if(!voice) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.voice = voice; u.lang = voice.lang;
    u.rate = rate || .85; u.pitch = 1.05; u.volume = 1;
    if(onend){
      let done = false;
      const fin = () => { if(!done){ done = true; onend(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 2500);  /* some engines never fire onend; keep the chain moving */
    }
    speechSynthesis.speak(u);
    if(!voiceToastShown){ voiceToastShown = true; toast('Voice: ' + voice.name); }
    return true;
  }catch(e){ return false; }
}

  t.classList.add('show');

}

/* ---------------- reading sets ---------------- */
function generateRead(){
  const s = store.read;

  if(levels.read === 2){
    /* alien words: pure decoding — no shape memory, no first-letter shortcuts */
    const n = Math.min(8, MIN + s.history.length);
    const used = new Set(), picks = [];
    while(picks.length < n){
      const w = alienWord();
      if(used.has(w)) continue;
      used.add(w);
      picks.push({w, cls:'green'});
    }
    s.history.push(picks);
    s.idx = s.history.length - 1;
    return;
  }

  const n = Math.min(MAX, MIN + s.history.length);
  const reds = n < 4 ? 1 : Math.round(n * 0.35);
  const used = new Set(), usedGroups = new Set(), picks = [];
  const clash = w => {
    const pw = plainWord(w);
    return used.has(pw) || (groupOf[pw] !== undefined && usedGroups.has(groupOf[pw]));
  };
  const take = (draw, cls) => {
    let w = draw(), guard = 0;
    while(clash(w) && guard++ < 40) w = draw();
    const pw = plainWord(w);
    used.add(pw);
    if(groupOf[pw] !== undefined) usedGroups.add(groupOf[pw]);
    picks.push({w, cls});
  };
  for(let i = 0; i < reds; i++)     take(drawRed,  'red');
  for(let i = 0; i < n - reds; i++) take(drawGreen,'green');

  /* neighbour distractors: plant a near-twin (sat/sit) so first-letter guessing loses */
  const pairTarget = Math.min(2, Math.max(1, Math.floor(n / 4)));
  const locked = new Set();
  let made = 0;
  for(const i of shuffle(picks.map((_, j) => j))){
    if(made >= pairTarget) break;
    const pw = plainWord(picks[i].w);
    const cands = (NEIGH[pw] || []).filter(c => {
      const cp = plainWord(c.raw);
      return !used.has(cp) &&
        !(groupOf[cp] !== undefined && usedGroups.has(groupOf[cp]));
    });
    if(!cands.length) continue;
    const victim = picks.findIndex((p, j) => j !== i && !locked.has(j));
    if(victim < 0) break;
    const vp = plainWord(picks[victim].w);
    used.delete(vp);
    if(groupOf[vp] !== undefined) usedGroups.delete(groupOf[vp]);
    const nb = cands[ri(cands.length)];
    picks[victim] = {w: nb.raw, cls: nb.cls};
    used.add(plainWord(nb.raw));
    if(groupOf[plainWord(nb.raw)] !== undefined) usedGroups.add(groupOf[plainWord(nb.raw)]);
    locked.add(i); locked.add(victim); made++;
  }

  shuffle(picks);
  s.history.push(picks);
  s.idx = s.history.length - 1;
}

  clearRound();
  const box = $('words');
  box.classList.remove('maths', 'build');
  box.innerHTML = '';
  const ws = Math.max(6.5, 19 - picks.length * 1.05);
  document.documentElement.style.setProperty('--ws', ws + 'vmin');

  round = {order: shuffle(picks.map((_, i) => i)), ti: 0, wrongs: 0, picks, els: []};

  picks.forEach((p, i) => {
    const s = document.createElement('span');
    s.className = 'word ' + p.cls;
    parseMark(p.w).forEach(sg => {
      if(sg.k === 'tricky'){
        const sp = document.createElement('span');
        sp.className = 'tk';
        sp.textContent = sg.txt;
        s.appendChild(sp);
      } else {
        markDigraphs(sg.txt).forEach(d => {
          const sp = document.createElement('span');
          if(d.k === 'di') sp.className = 'di';
          sp.textContent = d.txt;
          s.appendChild(sp);
        });
      }
    });
    s.style.setProperty('--rot', (Math.random() * 8 - 4).toFixed(1) + 'deg');
    s.style.animationDelay = (i * 0.06) + 's, ' + (Math.random() * 2).toFixed(2) + 's';
    s.style.pointerEvents = 'auto';
    s.addEventListener('pointerdown', ev => { ev.stopPropagation(); wordTap(i); });
    round.els.push(s);
    box.appendChild(s);
  });
  roundTimer = setTimeout(() => speakTarget(), 900 + picks.length * 60);
}

function currentWord(){ return plainWord(round.picks[round.order[round.ti]].w); }

function speakTarget(){
  if(mode !== 'read' || round.ti >= round.order.length) return;
  if(Date.now() < quietUntil){
    roundTimer = setTimeout(speakTarget, quietUntil - Date.now() + 200);
    return;
  }
  const w = currentWord();
  const ok = speak(w);
  if(!ok){
    /* no UK voice available: show the word to find instead */
    const card = $('targetCard');
    card.innerHTML = 'Find: <b>' + w + '</b>';
    card.classList.remove('hide');
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    if(!voiceToastShown){
      voiceToastShown = true;
      toast('No UK English voice on this device — showing the word instead');
    }
  }
}

function wordTap(i){
  if(mode !== 'read' || round.ti >= round.order.length) return;
  if(Date.now() < inputLock) return;
  const el = round.els[i];
  if(el.classList.contains('found')) return;
  if(i === round.order[round.ti]){
    round.wrongs = 0;
    el.classList.add('found');
    el.style.pointerEvents = 'none';
    flyStar(el, 1);          /* a found word charges the battery */
    popSound('up');
    round.ti++;
    if(round.ti >= round.order.length) celebrate();
    else roundTimer = setTimeout(() => speakTarget(), 800);
  } else {
    el.animate(
      [{translate:'0 0'},{translate:'-7px 0'},{translate:'7px 0'},{translate:'-5px 0'},{translate:'0 0'}],
      {duration:340, easing:'ease-in-out'});
    popSound('bump');
    if(++round.wrongs >= 3){
      /* button-mashing detected: brief pause, then the word again, slowly */
      round.wrongs = 0;
      inputLock = Date.now() + 1800;
      toast('Listen carefully \u{1F442}');
      roundTimer = setTimeout(() => { if(mode === 'read') speak(currentWord(), .6); }, 500);
    } else {
      roundTimer = setTimeout(() => speakTarget(), 650);
    }
  }
}

function flyStar(el, charge){
  const r = el.getBoundingClientRect(), sr = $('score').getBoundingClientRect();
  const st = document.createElement('div');
  st.textContent = '⭐';
  st.style.cssText = 'position:fixed;left:' + (r.left + r.width/2) + 'px;top:' + (r.top + r.height/2) +
    'px;font-size:30px;z-index:20;pointer-events:none;translate:-50% -50%';
  document.body.appendChild(st);
  const dx = (sr.left + sr.width/2) - (r.left + r.width/2);
  const dy = (sr.top + sr.height/2) - (r.top + r.height/2);
  st.animate(
    [{transform:'translate(0,0) scale(1)', opacity:1},
     {transform:'translate(' + dx + 'px,' + dy + 'px) scale(.3)', opacity:.6}],
    {duration:650, easing:'cubic-bezier(.4,0,.8,1)'}
  ).onfinish = () => { st.remove(); addScore(mode === 'add' || mode === 'sub' ? 1 : 2); if(charge) chargeBattery(charge); };
}

function celebrate(){
  popSound('win');
  speak('Well done!');
  for(let i = 0; i < 6; i++){
    setTimeout(() => burst(40 + Math.random() * (innerWidth - 80),
                           80 + Math.random() * (innerHeight - 200)), i * 130);
  }
  roundTimer = setTimeout(() => {
    if(mode !== 'read') return;
    generateRead();
    renderCurrent();
  }, 1700);
}

/* ---------------- maths sums ---------------- */
function generateAdd(){
  const s = store.add, last = s.history[s.history.length - 1];
  let a, b, g = 0;
  do{
    if(levels.add === 1){
      a = 1 + ri(9);
      b = 1 + ri(10 - a);
    } else if(levels.add === 3){
      /* teens plus units, never bridging: u is a's units digit and capping b
         at 9-u keeps (a%10)+b <= 9, so the ten is never broken open. The rung
         between "stays under ten" and "always crosses ten". Mirrors
         src/core/generators/sums.ts. */
      a = 10 + ri(9);
      const u = a - 10;
      b = 1 + ri(9 - u);
    } else {
      a = 1 + ri(10);
      const bmin = Math.max(1, 11 - a);
      b = bmin + ri(10 - bmin + 1);
    }
  } while(last && last.a === a && last.b === b && g++ < 5);
  s.history.push({a, b, op:'add'});
  s.idx = s.history.length - 1;
}

function generateSub(){
  const s = store.sub, last = s.history[s.history.length - 1];
  let a, b, g = 0;
  do{
    if(levels.sub === 1){
      a = 1 + ri(9);
      b = 1 + ri(a);
    } else if(levels.sub === 2){
      a = 11 + ri(10);
      b = 1 + ri(9);
    } else {
      a = 1 + ri(20);
      b = 1 + ri(a);
    }
  } while(last && last.a === a && last.b === b && g++ < 5);
  s.history.push({a, b, op:'sub'});
  s.idx = s.history.length - 1;
}

function renderSum(p){
  clearRound();
  const box = $('words');
  box.classList.remove('build');
  box.classList.add('maths');
  box.innerHTML = '';
  document.documentElement.style.setProperty('--ws', '12vmin');

  const pill = (txt, cls) => {
    const el = document.createElement('span');
    el.className = 'word ' + cls;
    el.textContent = txt;
    el.style.setProperty('--rot', (Math.random() * 6 - 3).toFixed(1) + 'deg');
    return el;
  };
  const op = t => {
    const el = document.createElement('span');
    el.className = 'op';
    el.textContent = t;
    return el;
  };

  const A = pill(p.a, 'blue'), B = pill(p.b, 'blue'), ANS = pill('?', 'mystery');
  box.append(A, op(p.op === 'add' ? '+' : '−'), B, op('='), ANS);

  const answer = p.op === 'add' ? p.a + p.b : p.a - p.b;
  let solved = false, wrongs = 0;
  const dotOpeners = [];
  const pad = document.createElement('div');

  const helper = (n, col) => {
    const h = document.createElement('div');
    h.className = 'helper';
    h.style.gridColumn = col;
    h.style.gridRow = '2';
    const chip = () => {
      h.innerHTML = '';
      const c = document.createElement('div');
      c.className = 'qchip';
      c.textContent = '?';
      h.appendChild(c);
    };
    const dots = () => {
      h.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'dotbox';
      for(let i = 0; i < n; i++){
        const dt = document.createElement('span');
        dt.className = 'dot ' + (Math.floor(i / 5) % 2 === 0 ? 'o' : 'b');
        d.appendChild(dt);
      }
      h.appendChild(d);
    };
    let shown = false;
    h.addEventListener('pointerdown', e => {
      e.stopPropagation();
      shown = !shown;
      shown ? dots() : chip();
    });
    dotOpeners.push(() => { if(!shown){ shown = true; dots(); } });
    chip();
    return h;
  };
  box.append(helper(p.a, '1'), helper(p.b, '3'));

  const revealAns = () => {
    solved = true;
    pad.classList.add('done');
    ANS.textContent = answer;
    ANS.classList.remove('mystery');
    ANS.classList.add('blue');
    ANS.style.animation = 'none'; void ANS.offsetWidth; ANS.style.animation = '';
    const r = ANS.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
  };

  /* the grey ? still reveals, but earns nothing — peeking is free, not profitable */
  ANS.style.pointerEvents = 'auto';
  ANS.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if(solved) return;
    revealAns();
    popSound('win');
  });

  /* answer pad as a number track: 0 apart, then 1-10 with 11-20 aligned
     directly beneath so the +10 pattern is visible; fives colour-blocked
     to match the counting-dot groups */
  pad.className = 'numpad';
  pad.style.gridColumn = '1 / -1';
  pad.style.gridRow = '3';
  const mkChip = n => {
    const c = document.createElement('span');
    c.className = 'nchip ' + (n === 0 ? 'zero'
      : (Math.floor((n - 1) / 5) % 2 === 0 ? 'five-a' : 'five-b'));
    c.textContent = n;
    c.style.animationDelay = (n * 0.02) + 's';
    c.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if(solved || Date.now() < inputLock) return;
      if(n === answer){
        wrongs = 0;
        c.classList.add('hit');
        revealAns();
        flyStar(c);       /* the star landing banks the point */
        popSound('win');
        /* auto-advance to the next sum (a new sum costs one charge),
           waiting out any reward show plus its one-second breath */
        const adv = () => {
          if(mode !== 'add' && mode !== 'sub') return;
          if(Date.now() < rewardUntil){
            roundTimer = setTimeout(adv, rewardUntil - Date.now() + 60);
            return;
          }
          const st2 = store[mode];
          if(st2.idx < st2.history.length - 1){ st2.idx++; }
          else {
            if(!spendBattery()){ batteryEmptyNudge(); return; }
            GEN[mode]();
          }
          renderCurrent();
        };
        roundTimer = setTimeout(adv, 2000);
      } else {
        c.animate(
          [{translate:'0 0'},{translate:'-6px 0'},{translate:'6px 0'},{translate:'-4px 0'},{translate:'0 0'}],
          {duration:300, easing:'ease-in-out'});
        popSound('bump');
        if(++wrongs >= 3){
          /* button-mashing detected: pause the pad and open the counting dots */
          wrongs = 0;
          inputLock = Date.now() + 2000;
          dotOpeners.forEach(f => f());
          toast('Count the dots! \u{1F440}');
          popSound('down');
        }
      }
    });
    return c;
  };
  const zrow = document.createElement('div');
  zrow.className = 'zrow';
  zrow.appendChild(mkChip(0));
  const tgrid = document.createElement('div');
  tgrid.className = 'tgrid';
  for(let n = 1; n <= 20; n++) tgrid.appendChild(mkChip(n));
  pad.append(zrow, tgrid);
  box.appendChild(pad);
}

/* ---------------- word building ---------------- */
function generateBuild(){
  const s = store.build;
  let w = '', g = 0;
  do{
    w = levels.build === 2 ? alienWord() : plainWord(drawGreen());
  } while(w.length < 2 && g++ < 20);
  const segs = markDigraphs(w).flatMap(d => d.k === 'di' ? [d.txt] : d.txt.split(''));
  const segSet = new Set(segs);
  const DECOYS = ['b','c','d','f','g','h','j','l','m','n','p','r','s','t','v','w','z',
                  'a','e','i','o','u','ch','sh','th','ee','oo','or','ck','ll','ng'];
  const decoys = [];
  let dg = 0;
  while(decoys.length < 3 && dg++ < 60){
    const c = DECOYS[ri(DECOYS.length)];
    if(!segSet.has(c) && !decoys.includes(c)) decoys.push(c);
  }
  s.history.push({w, segs, tray: shuffle([...segs, ...decoys])});
  s.idx = s.history.length - 1;
}

function speakBuildWord(){
  if(mode !== 'build') return;
  if(Date.now() < quietUntil){
    roundTimer = setTimeout(speakBuildWord, quietUntil - Date.now() + 200);
    return;
  }
  const item = store.build.history[store.build.idx];
  if(!item) return;
  const ok = speak(item.w);
  if(!ok){
    /* no voice: show the word — copying it tile by tile is early spelling, still a win */
    const card = $('targetCard');
    card.innerHTML = 'Build: <b>' + item.w + '</b>';
    card.classList.remove('hide');
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  }
}


/* ---- Fred talk: sound the word out, one grapheme at a time ----
   Best-effort sound map: continuants (sss, mmm, shh) come out well on TTS,
   stop consonants carry an unavoidable schwa (buh, tuh), and the slot
   highlight paces the sounding-out either way. */
const FRED_SOUNDS = {
  a:'ah', e:'eh', i:'ih', o:'oh', u:'uh',
  b:'buh', c:'cuh', d:'duh', f:'fff', g:'guh', h:'huh', j:'juh', k:'kuh',
  l:'lll', m:'mmm', n:'nnn', p:'puh', r:'rrr', s:'sss', t:'tuh', v:'vvv',
  w:'wuh', y:'yuh', z:'zzz',
  ch:'chuh', sh:'shh', th:'thuh', wh:'wuh', ng:'ing', ck:'kuh',
  ll:'lll', ss:'sss', ff:'fff', ee:'ee', oo:'oo', or:'or'
};

function fredTalk(){
  if(mode !== 'build') return;
  const item = store.build.history[store.build.idx];
  if(!item) return;
  const token = ++fredToken;
  const slots = document.querySelectorAll('#words .slot');
  const seq = item.segs.map(sg => FRED_SOUNDS[sg] || sg);
  let k = 0;
  /* each sound plays to completion before the next begins — no beheading */
  const stepFred = () => {
    if(token !== fredToken || mode !== 'build') return;
    slots.forEach(sl => sl.classList.remove('fredhl'));
    if(k >= seq.length){
      speak(item.w);
      return;
    }
    if(slots[k]) slots[k].classList.add('fredhl');
    const spoke = speak(seq[k], .9, () => setTimeout(stepFred, 320));
    k++;
    if(!spoke) setTimeout(stepFred, 850);  /* no voice: visual pacing only */
  };
  setTimeout(stepFred, 350);
}

function renderBuild(item){
  clearRound();
  const box = $('words');
  box.classList.remove('maths');
  box.classList.add('build');
  box.innerHTML = '';

  const slotRow = document.createElement('div');
  slotRow.className = 'slotrow';
  const slots = item.segs.map(() => {
    const sl = document.createElement('span');
    sl.className = 'slot';
    slotRow.appendChild(sl);
    return sl;
  });

  const tray = document.createElement('div');
  tray.className = 'tray';
  let pos = 0, doneB = false, wrongsB = 0;
  item.tray.forEach((tk, i) => {
    const t = document.createElement('span');
    t.className = 'tile' + (tk.length > 1 ? ' di2' : '');
    t.textContent = tk;
    t.style.animationDelay = (i * 0.05) + 's';
    t.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if(doneB || t.classList.contains('used') || Date.now() < inputLock) return;
      if(tk === item.segs[pos]){
        wrongsB = 0;
        t.classList.add('used');
        slots[pos].textContent = tk;
        slots[pos].classList.add('filled');
        if(tk.length > 1) slots[pos].classList.add('di2');
        pos++;
        popSound('up');
        if(pos >= item.segs.length){
          doneB = true;
          speak(item.w);
          const r = slotRow.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2);
          flyStar(slotRow, 2);   /* building is harder work: bigger charge */
          popSound('win');
          const nextB = () => {
            if(mode !== 'build') return;
            if(Date.now() < rewardUntil){
              roundTimer = setTimeout(nextB, rewardUntil - Date.now() + 60);
              return;
            }
            generateBuild();
            renderCurrent();
          };
          roundTimer = setTimeout(nextB, 1600);
        }
      } else {
        t.animate(
          [{translate:'0 0'},{translate:'-6px 0'},{translate:'6px 0'},{translate:'-4px 0'},{translate:'0 0'}],
          {duration:300, easing:'ease-in-out'});
        popSound('bump');
        if(++wrongsB >= 3){
          /* button-mashing detected: Fred to the rescue */
          wrongsB = 0;
          inputLock = Date.now() + 1800;
          fredTalk();
        }
      }
    });
    tray.appendChild(t);
  });

  box.append(slotRow, tray);
  roundTimer = setTimeout(() => { if(mode === 'build') speakBuildWord(); }, 900);
}

/* ---------------- render / navigation ---------------- */
const GEN = {read:generateRead, build:generateBuild, add:generateAdd, sub:generateSub};

function renderCurrent(){
  const item = store[mode].history[store[mode].idx];
  if(mode === 'read') renderSet(item);
  else if(mode === 'build') renderBuild(item);
  else renderSum(item);
}

function forward(e){
  const s = store[mode];
  if(s.idx < s.history.length - 1) s.idx++;
  else {
    if((mode === 'add' || mode === 'sub') && !spendBattery()){
      batteryEmptyNudge();
      const box = $('words');
      box.classList.remove('nudge'); void box.offsetWidth; box.classList.add('nudge');
      return;
    }
    GEN[mode]();
  }
  renderCurrent();
  updateScore();
  burst(e.clientX, e.clientY);
  popSound('up');
}

function back(e){
  const s = store[mode];
  if(s.idx > 0){
    s.idx--;
    renderCurrent();
    burst(e.clientX, e.clientY);
    popSound('down');
  } else {
    const box = $('words');
    box.classList.remove('nudge'); void box.offsetWidth; box.classList.add('nudge');
    popSound('bump');
  }
}

/* ================= reward spectacles ================= */
let CHILD_NAME = 'Juno';   /* set from the active player */
const REWARD_EVERY = 20;   /* points between spectacles; literacy pays 2, maths pays 1 */
let quietUntil = 0;

const fx = $('fx'), fctx = fx.getContext('2d');
function sizeFx(){
  const d = window.devicePixelRatio || 1;
  fx.width = innerWidth * d; fx.height = innerHeight * d;
  fctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', sizeFx); sizeFx();

/* canvas particles — the trails are drawn, not emoji */
let parts = [], anim = null, spect = null;
function addPart(x, y, o){
  parts.push({x, y, vx:o.vx||0, vy:o.vy||0, g:o.g||0,
    life:o.life||1, max:o.life||1, size:o.size||3, col:o.col||'#fff', glow:!!o.glow});
  if(parts.length > 520) parts.splice(0, parts.length - 520);
}
function loop(ts){
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if(spect){
    let alive = false;
    for(const u of spect.units){
      const t = (ts - spect.t0 - u.delay) / u.dur;
      if(t < 0){
        alive = true;
      } else if(t < 1){
        alive = true;
        if(u.el && !u.shown){ u.shown = true; u.el.style.display = 'block'; }
        u.step(t, u);
      } else if(u.el && !u.done){
        u.done = true; u.el.remove();
      }
    }
    if(!alive){
      spect.units.forEach(u => u.el && u.el.remove());
      spect = null;
    }
  }
  for(const p of parts){
    p.x += p.vx / 60; p.y += p.vy / 60; p.vy += p.g / 60; p.life -= 1/60;
  }
  parts = parts.filter(p => p.life > 0);
  for(const p of parts){
    const a = Math.max(0, p.life / p.max);
    fctx.globalCompositeOperation = p.glow ? 'lighter' : 'source-over';
    fctx.globalAlpha = a;
    fctx.fillStyle = p.col;
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, 6.2832);
    fctx.fill();
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
  if(spect || parts.length) anim = requestAnimationFrame(loop);
  else { anim = null; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}
function ensureLoop(){ if(!anim) anim = requestAnimationFrame(loop); }

/* each spectacle is a cast of units: DOM actors with particle trails,
   or pure canvas drawings — several per theme, so no theme is the boring one */
function makeActor(emoji, px){
  const el = document.createElement('div');
  el.className = 'spectChar';
  el.textContent = emoji;
  el.style.fontSize = px + 'px';
  el.style.display = 'none';
  document.body.appendChild(el);
  return el;
}

/* crossers hand their emitters the glyph's trailing edge and centre line,
   so trails hug the character whatever its size or direction */
function crosser(o){
  const el = makeActor(o.emoji, o.px);
  const gw = o.w || o.px;                 /* visual glyph width */
  const flipT = o.flip ? ' scale(-1,1)' : '';
  return {
    el, delay: o.delay || 0, dur: o.dur,
    step: (t, u) => {
      const vw = innerWidth;
      const x = o.dir === 'ltr'
        ? -gw - 30 + t * (vw + gw + 90)
        : vw + 30 - t * (vw + gw + 90);
      const y = o.y(t);
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)' + flipT;
      const cx = x + gw * 0.5;
      const cy = y + o.px * 0.55;
      const bx = o.dir === 'ltr' ? cx - gw * 0.45 : cx + gw * 0.45;
      o.emit(bx, cy, t, u);
    }
  };
}

function spectacle(name){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = innerWidth, h = innerHeight;
  const rnd = n => (Math.random() * 2 - 1) * n;
  const units = [];

  if(name === 'ocean'){        /* mermaid leads a dolphin and a fish, all with bubble wakes */
    const wake = (bx, cy) => {
      for(let i = 0; i < 3; i++) addPart(bx + rnd(8), cy + rnd(12),
        {vx:30 + rnd(20), vy:-30 - Math.random() * 50, size:2 + Math.random() * 4.2,
         life:.8 + Math.random() * .8,
         col: i % 2 ? 'rgba(255,255,255,.9)' : 'rgba(160,225,255,.9)'});
    };
    units.push(crosser({emoji:'\u{1F9DC}\u200D\u2640\uFE0F', px:78, dir:'rtl', dur:3600,
      y:t => h * 0.40 + Math.sin(t * 12.6) * 34, emit:wake}));
    units.push(crosser({emoji:'\u{1F42C}', px:52, dir:'rtl', delay:500, dur:2800,
      y:t => h * 0.54 + Math.sin(t * 9) * 22, emit:wake}));
    units.push(crosser({emoji:'\u{1F420}', px:40, dir:'rtl', delay:1000, dur:3200,
      y:t => h * 0.28 + Math.sin(t * 15) * 16, emit:wake}));

  } else if(name === 'space'){ /* a volley of three shooting stars, fully drawn */
    const comet = (delay, dur, y0, y1, size) => ({delay, dur, step: t => {
      const x = -40 + t * (w + 120);
      const y = y0 + t * (y1 - y0);
      fctx.globalCompositeOperation = 'lighter';
      const gr = fctx.createRadialGradient(x, y, 0, x, y, size);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(1, 'rgba(150,190,255,0)');
      fctx.fillStyle = gr;
      fctx.beginPath(); fctx.arc(x, y, size, 0, 6.2832); fctx.fill();
      fctx.globalCompositeOperation = 'source-over';
      for(let i = 0; i < 4; i++) addPart(x + rnd(4), y + rnd(4),
        {vx:-(60 + Math.random() * 80), vy:-(20 + Math.random() * 40),
         size:1.4 + Math.random() * 2.8, life:.5 + Math.random() * .7,
         col: i % 3 ? '#cfe4ff' : '#ffffff', glow:true});
    }});
    units.push(comet(0, 2000, h * 0.10, h * 0.55, 14));
    units.push(comet(600, 1700, h * 0.26, h * 0.62, 10));
    units.push(comet(1200, 2200, h * 0.05, h * 0.42, 8));

  } else if(name === 'unicorn'){ /* unicorn, fairy and butterfly with their own trails */
    units.push(crosser({emoji:'\u{1F984}', px:80, flip:true, dir:'ltr', dur:3400,
      y:t => h * 0.40 + Math.sin(t * 9.4) * 22 - Math.abs(Math.sin(t * 31.4)) * 12,
      emit:(bx, cy, t) => {
        for(let i = 0; i < 4; i++) addPart(bx + rnd(8), cy + 6 + rnd(12),
          {vx:-40 + rnd(25), vy:rnd(30), g:36, size:2 + Math.random() * 4,
           life:1 + Math.random() * .8,
           col:'hsl(' + ((t * 720 + i * 45) % 360) + ',95%,62%)', glow:true});
      }}));
    units.push(crosser({emoji:'\u{1F9DA}', px:46, flip:true, dir:'ltr', delay:600, dur:3000,
      y:t => h * 0.22 + Math.sin(t * 12) * 24,
      emit:(bx, cy) => {
        for(let i = 0; i < 3; i++) addPart(bx + rnd(6), cy + rnd(10),
          {vx:-30 + rnd(20), vy:rnd(24), size:1.6 + Math.random() * 3,
           life:.8 + Math.random() * .6,
           col: i % 2 ? '#ffe08a' : '#ffffff', glow:true});
      }}));
    units.push(crosser({emoji:'\u{1F98B}', px:36, flip:true, dir:'ltr', delay:1100, dur:3600,
      y:t => h * 0.52 + Math.sin(t * 16) * 24,
      emit:(bx, cy) => {
        for(let i = 0; i < 2; i++) addPart(bx + rnd(6), cy + rnd(8),
          {vx:-24 + rnd(16), vy:rnd(20), size:1.6 + Math.random() * 2.6,
           life:.7 + Math.random() * .6,
           col: i % 2 ? '#ffb3e2' : '#e2c6ff', glow:true});
      }}));

  } else if(name === 'garden'){ /* the rainbow paints itself while a butterfly and bee cross */
    const cx = w / 2, cy = h * 0.98, R = Math.min(w, h) * 0.62;
    const band = Math.max(6, Math.min(w, h) * 0.02);
    const cols = ['#ff5a5a','#ff9d3c','#ffe14d','#5ad06a','#4aa8ff','#7b6cff','#c06cff'];
    units.push({delay:0, dur:4200, step: t => {
      const grow = Math.min(1, t / 0.55);
      const alpha = t < 0.8 ? 1 : 1 - (t - 0.8) / 0.2;
      const a0 = Math.PI, a1 = Math.PI + Math.PI * grow;
      fctx.globalAlpha = alpha * 0.9;
      fctx.lineCap = 'round';
      cols.forEach((c, i) => {
        fctx.strokeStyle = c; fctx.lineWidth = band;
        fctx.beginPath(); fctx.arc(cx, cy, R - i * band, a0, a1); fctx.stroke();
      });
      fctx.globalAlpha = 1;
      if(grow < 1){
        const tx = cx + Math.cos(a1) * (R - 3 * band);
        const ty = cy + Math.sin(a1) * (R - 3 * band);
        for(let i = 0; i < 3; i++) addPart(tx + rnd(10), ty + rnd(10),
          {vx:rnd(40), vy:-20 + rnd(30), size:2 + Math.random() * 3,
           life:.7 + Math.random() * .6, col: i % 2 ? '#ffffff' : '#ffe08a', glow:true});
      }
    }});
    units.push(crosser({emoji:'\u{1F98B}', px:40, flip:true, dir:'ltr', delay:400, dur:3400,
      y:t => h * 0.28 + Math.sin(t * 13) * 30,
      emit:(bx, cy) => {
        for(let i = 0; i < 2; i++) addPart(bx + rnd(6), cy + rnd(8),
          {vx:-24 + rnd(16), vy:rnd(20), size:1.6 + Math.random() * 2.6,
           life:.7 + Math.random() * .6,
           col: i % 2 ? '#ffb3e2' : '#ffffff', glow:true});
      }}));
    units.push(crosser({emoji:'\u{1F41D}', px:34, dir:'rtl', delay:900, dur:3000,
      y:t => h * 0.46 + Math.sin(t * 17) * 22,
      emit:(bx, cy) => {
        for(let i = 0; i < 2; i++) addPart(bx + rnd(6), cy + rnd(8),
          {vx:24 + rnd(16), vy:rnd(20), size:1.5 + Math.random() * 2.4,
           life:.6 + Math.random() * .5,
           col: i % 2 ? '#ffe14d' : '#ffffff', glow:true});
      }}));

  } else if(name === 'halloween'){ /* the witch flies escort with two bats */
    const sparks = (c1, c2, n) => (bx, cy) => {
      for(let i = 0; i < n; i++) addPart(bx + rnd(8), cy + rnd(10),
        {vx:50 + rnd(30), vy:-10 + rnd(30), size:1.8 + Math.random() * 3.2,
         life:.8 + Math.random() * .7, col: i % 2 ? c1 : c2, glow:true});
    };
    units.push(crosser({emoji:'\u{1F9D9}', px:74, dir:'rtl', dur:3000,
      y:t => h * 0.28 + Math.sin(t * 9.4) * 26, emit:sparks('#8bff5a', '#c07bff', 4)}));
    units.push(crosser({emoji:'\u{1F987}', px:40, dir:'rtl', delay:500, dur:2400,
      y:t => h * 0.16 + Math.sin(t * 14) * 22, emit:sparks('#c07bff', '#ffffff', 2)}));
    units.push(crosser({emoji:'\u{1F987}', px:32, dir:'rtl', delay:1000, dur:2700,
      y:t => h * 0.46 + Math.sin(t * 18) * 24, emit:sparks('#8bff5a', '#ffffff', 2)}));

  } else if(name === 'christmas'){ /* the sleigh, a robin, and a golden star */
    units.push(crosser({emoji:'\u{1F98C}\u{1F6F7}', px:62, w:120, dir:'rtl', dur:3600,
      y:t => h * 0.24 - t * 26 + Math.sin(t * 6.3) * 14,
      emit:(bx, cy) => {
        for(let i = 0; i < 4; i++) addPart(bx + rnd(10), cy + rnd(12),
          {vx:60 + rnd(30), vy:10 + rnd(25), g:12, size:1.6 + Math.random() * 3.2,
           life:.9 + Math.random() * .8,
           col: i % 3 ? '#ffd88a' : '#ffffff', glow: i % 3 !== 0});
      }}));
    units.push(crosser({emoji:'\u{1F426}', px:36, dir:'rtl', delay:700, dur:3000,
      y:t => h * 0.44 + Math.sin(t * 12) * 22,
      emit:(bx, cy) => {
        for(let i = 0; i < 2; i++) addPart(bx + rnd(6), cy + rnd(8),
          {vx:30 + rnd(18), vy:rnd(22), size:1.5 + Math.random() * 2.4,
           life:.7 + Math.random() * .5, col:'#ffffff', glow:i % 2 === 0});
      }}));
    units.push({delay:1300, dur:1800, step: t => {
      const x = -30 + t * (w + 90), y = h * 0.08 + t * h * 0.22;
      fctx.globalCompositeOperation = 'lighter';
      const gr = fctx.createRadialGradient(x, y, 0, x, y, 11);
      gr.addColorStop(0, 'rgba(255,244,200,1)');
      gr.addColorStop(1, 'rgba(255,216,138,0)');
      fctx.fillStyle = gr;
      fctx.beginPath(); fctx.arc(x, y, 11, 0, 6.2832); fctx.fill();
      fctx.globalCompositeOperation = 'source-over';
      for(let i = 0; i < 3; i++) addPart(x + rnd(4), y + rnd(4),
        {vx:-(50 + Math.random() * 70), vy:-(16 + Math.random() * 30),
         size:1.4 + Math.random() * 2.6, life:.5 + Math.random() * .6,
         col: i % 2 ? '#ffd88a' : '#fff6d8', glow:true});
    }});

  } else {                     /* summer: a pod of three leaping dolphins */
    const dolphinUnit = (delay, dur, px, baseY, jump) => crosser({
      emoji:'\u{1F42C}', px, dir:'rtl', delay, dur,
      y:t => baseY - Math.abs(Math.sin(t * 3 * Math.PI)) * jump,
      emit:(bx, cy, t, u) => {
        const lift = Math.abs(Math.sin(t * 3 * Math.PI));
        if(lift > 0.12)
          for(let i = 0; i < 3; i++) addPart(bx + rnd(8), cy + rnd(10),
            {vx:30 + rnd(25), vy:20 + rnd(40), g:150, size:1.8 + Math.random() * 3,
             life:.6 + Math.random() * .5,
             col: i % 2 ? 'rgba(190,235,255,.95)' : 'rgba(255,255,255,.9)'});
        const seg = Math.floor(t * 3);
        if(seg !== u.seg){
          u.seg = seg;
          for(let i = 0; i < 14; i++) addPart(bx + rnd(20), baseY + px * 0.8,
            {vx:rnd(90), vy:-(60 + Math.random() * 120), g:260,
             size:2 + Math.random() * 3.4, life:.5 + Math.random() * .5,
             col:'rgba(210,240,255,.95)'});
        }
      }
    });
    units.push(dolphinUnit(0, 3400, 72, h * 0.50, 100));
    units.push(dolphinUnit(450, 3100, 56, h * 0.54, 80));
    units.push(dolphinUnit(900, 3700, 46, h * 0.46, 90));
  }

  spect = {t0: performance.now(), units};
  ensureLoop();
}

function addScore(n = 1){
  const before = Math.floor(score / REWARD_EVERY);
  score += n;
  day.pts += n;
  updateScore();
  const v = visitorSticker();
  if(v && !day.gift && day.pts >= VISIT_GOAL && !ownedSet().has(v.id)) befriend(v);
  if(Math.floor(score / REWARD_EVERY) > before) reward();
}

/* ---------------- the maths battery ---------------- */
function updateBattery(anim){
  const b = $('battery');
  $('battNum').textContent = batteryOn ? battery : '\u221E';
  const pct = batteryOn ? Math.min(1, battery / 10) : 1;
  $('battFill').style.width = 'calc((100% - 4px) * ' + pct + ')';
  $('battFill').style.background = !batteryOn ? '#9aa7b5'
    : battery <= 1 ? '#e2362b'
    : battery <= 4 ? '#ffb648' : '#57d06a';
  if(anim){ b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
}

function chargeBattery(n){
  if(!batteryOn) return;
  battery = Math.min(BATT_MAX, battery + n);
  updateBattery(true);
}

function spendBattery(){
  if(!batteryOn) return true;
  if(battery <= 0) return false;
  battery--;
  updateBattery(true);
  return true;
}

function batteryEmptyNudge(){
  $('battery').animate(
    [{translate:'0 0'},{translate:'-6px 0'},{translate:'6px 0'},{translate:'-4px 0'},{translate:'0 0'}],
    {duration:340, easing:'ease-in-out'});
  toast('Battery empty! Find words to charge it \u{1F50B}');
  popSound('bump');
  ['btnRead','btnBuild'].forEach(id => {
    $(id).animate([{scale:'1'},{scale:'1.25'},{scale:'1'}],
      {duration:600, easing:'ease-in-out', iterations:2});
  });
}

/* ---------------- the collection ---------------- */
function pickHatch(){
  const os = ownedSet();
  const home = STICKERS[theme].filter(s => !os.has(s.id));
  if(home.length) return home[ri(home.length)];
  const any = CAT_FLAT.filter(s => !os.has(s.id));
  return any.length ? any[ri(any.length)] : null;
}

function hatchSticker(){
  const s = pickHatch();
  $('egg').animate(
    [{scale:'1'},{scale:'1.35',rotate:'-12deg'},{scale:'1.2',rotate:'12deg'},{scale:'1'}],
    {duration:700, easing:'ease-in-out'});
  $('eggEmoji').textContent = '\u{1F423}';
  setTimeout(() => { $('eggEmoji').textContent = '\u{1F95A}'; }, 1600);
  if(!s){
    toast('Sticker book complete! \u{1F31F}');
    return;
  }
  owned.push(s.id);
  saveSoon();
  const card = $('hatchCard');
  $('hatchEmoji').textContent = s.e;
  $('hatchName').textContent = capName(s.n) + '!';
  card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
  setTimeout(() => speak('You found ' + article(s.n) + ' ' + s.n + '!'), 2300);
  setTimeout(() => {
    card.classList.remove('show');
    const br = $('btnBook').getBoundingClientRect();
    const fl = document.createElement('div');
    fl.textContent = s.e;
    fl.style.cssText = 'position:fixed;left:50%;top:46%;font-size:60px;z-index:35;' +
      'pointer-events:none;translate:-50% -50%';
    document.body.appendChild(fl);
    fl.animate(
      [{transform:'translate(0,0) scale(1)', opacity:1},
       {transform:'translate(' + (br.left + br.width/2 - innerWidth/2) + 'px,' +
        (br.top + br.height/2 - innerHeight * 0.46) + 'px) scale(.3)', opacity:.5}],
      {duration:750, easing:'cubic-bezier(.4,0,.8,1)'}
    ).onfinish = () => fl.remove();
    if(s.theme === theme) buildAmbience();
  }, 2600);
}

function befriend(s){
  day.gift = true;
  owned.push(s.id);
  saveSoon();
  quietUntil = Date.now() + 2600;
  toast(capName(s.n) + ' is your friend now! \u{1F389}');
  speak(capName(s.n) + ' is your friend now!');
  popSound('win');
  burst(innerWidth * 0.78, innerHeight * 0.3);
  buildAmbience();
}

/* owned stickers of a theme live in its world; stills get stable homes */
function placeOwned(a){
  const os = ownedSet();
  STICKERS[theme].forEach(s => {
    if(!os.has(s.id)) return;
    if(s.still){
      const h = strHash(s.id);
      addDecor(a, s.e, 8 + (h % 80), 26 + (h % 20));
    } else {
      addCritter(a, s.e, 20 + Math.random() * 24, 10, 68);
    }
  });
}

function renderVisitor(a){
  const v = visitorSticker();
  if(!v) return;
  if(v.theme !== theme) return;  /* visitors wait in their home theme */
  const el = document.createElement('div');
  el.className = 'visitor';
  el.style.left = '76vw';
  el.style.top = '26vh';
  const em = document.createElement('span');
  em.textContent = v.e;
  const s1 = document.createElement('span');
  s1.className = 'vs'; s1.textContent = '\u2728';
  s1.style.cssText = 'left:-10px;top:-4px';
  const s2 = document.createElement('span');
  s2.className = 'vs'; s2.textContent = '\u2728';
  s2.style.cssText = 'right:-10px;bottom:2px;animation-delay:.5s';
  el.append(em, s1, s2);
  el.addEventListener('pointerdown', e => {
    e.stopPropagation();
    em.animate([{rotate:'0deg'},{rotate:'-14deg'},{rotate:'14deg'},{rotate:'0deg'}],
      {duration:420, easing:'ease-in-out'});
    speak('Hello! I\u2019m the ' + v.n + '!');
  });
  a.appendChild(el);
}

/* ---------------- sticker book ---------------- */
function renderBook(){
  const body = $('bkBody');
  body.innerHTML = '';
  const os = ownedSet();
  let tot = 0, have = 0;
  for(const th in STICKERS){
    const hd = document.createElement('div');
    hd.className = 'bkHd';
    hd.textContent = THEMES[th].score + ' ' + th;
    const grid = document.createElement('div');
    grid.className = 'bkGridSec';
    STICKERS[th].forEach(s => {
      tot++;
      const got = os.has(s.id);
      if(got) have++;
      const cell = document.createElement('div');
      cell.className = 'stk' + (got ? '' : ' mys');
      const se = document.createElement('span'); se.className = 'se'; se.textContent = s.e;
      const sn = document.createElement('span'); sn.className = 'sn'; sn.textContent = s.n;
      cell.append(se, sn);
      if(got) cell.addEventListener('pointerdown', e => {
        e.stopPropagation();
        se.animate([{scale:'1'},{scale:'1.3'},{scale:'1'}], {duration:300});
        speak(s.n);
      });
      grid.appendChild(cell);
    });
    body.append(hd, grid);
  }
  $('bkCount').textContent = have + ' / ' + tot;
}

/* ---------------- sound effects ---------------- */
function note(freq1, freq2, t, dur, vol){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq1, t);
  o.frequency.exponentialRampToValueAtTime(freq2, t + dur * .55);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + dur + .02);
}

function popSound(kind){
  if(!soundOn) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const {lo, hi} = THEMES[theme];
    if(kind === 'up')        note(lo, hi, t, .22, .25);
    else if(kind === 'down') note(hi, lo, t, .22, .22);
    else if(kind === 'bump') note(170, 120, t, .18, .18);
    else if(kind === 'win'){ note(lo, lo * 1.6, t, .16, .22); note(hi, hi * 1.3, t + .14, .28, .22); }
  }catch(e){/* no audio, no drama */}
}

/* ---------------- theme / mode / level ---------------- */
function setTheme(t){
  theme = t;
  document.body.className = t;
  for(const k in THEMES) $(THEMES[k].btn).classList.toggle('on', k === t);
  buildAmbience();
  updateScore();
}

function setMode(m){
  mode = m;
  for(const k in MODEBTN) $(MODEBTN[k]).classList.toggle('on', k === m);
  $('btnL3').classList.toggle('hide', m !== 'sub');
  if(levels[m] > 2 && m !== 'sub') levels[m] = 2;
  [1,2,3].forEach(l => $('btnL' + l).classList.toggle('on', levels[m] === l));
  $('legend').classList.toggle('hide', m !== 'read');
  $('btnSay').classList.toggle('hide', m === 'add' || m === 'sub');
  $('btnFred').classList.toggle('hide', m !== 'build');
  $('hint').innerHTML =
    m === 'read'  ? 'Listen, then tap the word! &middot; Tap right for new words' :
    m === 'build' ? 'Listen, then build the word! &middot; Tap right for a new word' :
                    'Tap the answer! &middot; Tap right for a new sum';
  if(store[m].idx < 0) GEN[m]();
  renderCurrent();
}

function setLevel(l){
  if(l === 3 && mode !== 'sub') return;
  levels[mode] = l;
  [1,2,3].forEach(x => $('btnL' + x).classList.toggle('on', x === l));
  GEN[mode]();
  renderCurrent();
}

/* ---------------- events ---------------- */
/* near-misses around buttons, words, tiles and chips must NOT turn the page */
function inDeadZone(x, y){
  const pad = 16;
  const els = document.querySelectorAll(
    '#hudLeft,#hudRight,#footer,#words .word,#words .nchip,#words .tile,#words .helper,#words .slot,.visitor');
  for(const el of els){
    const r = el.getBoundingClientRect();
    if(x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad) return true;
  }
  return false;
}

$('scene').addEventListener('pointerdown', e => {
  if(inDeadZone(e.clientX, e.clientY)) return;
  if(e.clientX < window.innerWidth * 0.5) back(e);
  else forward(e);
});

for(const k in THEMES) $(THEMES[k].btn).addEventListener('click', () => setTheme(k));
for(const k in MODEBTN) $(MODEBTN[k]).addEventListener('click', () => setMode(k));
[1,2,3].forEach(l => $('btnL' + l).addEventListener('click', () => setLevel(l)));

$('btnSay').addEventListener('click', () => mode === 'build' ? speakBuildWord() : speakTarget());
$('btnFred').addEventListener('click', fredTalk);

$('btnGear').addEventListener('click', () => {
  const d = new Date();
  const pin = String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0');
  const entry = prompt('Grown-ups only \u2014 PIN please:');
  if(entry === null) return;
  if(entry.trim() !== pin){ toast('Wrong PIN'); return; }
  const choice = prompt(
    'Grown-up menu:\n1 \u2014 Maths battery on/off\n2 \u2014 Reset THIS player (wipes their stickers and score)\n3 \u2014 Delete a player', '1');
  if(choice === null) return;
  if(choice.trim() === '1'){
    batteryOn = !batteryOn;
    toast(batteryOn ? 'Maths battery ON \u2014 reading charges it \u26A1' : 'Maths battery off \u221E');
    updateBattery(true);
  } else if(choice.trim() === '2'){
    if(!confirm('Really wipe ALL of ' + CHILD_NAME + "'s progress, including the sticker book?")) return;
    try{ localStorage.removeItem(saveKey()); }catch(e){}
    location.reload();
  } else if(choice.trim() === '3'){
    const names = profs.list.map((p, i) => (i + 1) + ' \u2014 ' + p.name).join('\n');
    const pick = prompt('Delete which player?\n' + names);
    if(pick === null) return;
    const idx = parseInt(pick.trim(), 10) - 1;
    const victim = profs.list[idx];
    if(!victim){ toast('No such player'); return; }
    if(!confirm('Delete ' + victim.name + ' and ALL their progress forever?')) return;
    try{ localStorage.removeItem(SAVE_ROOT + '.' + victim.id); }catch(e){}
    profs.list.splice(idx, 1);
    if(!profs.list.length || profs.current === victim.id){
      profs.current = profs.list.length ? profs.list[0].id : null;
    }
    saveProfiles();
    location.reload();
  }
});

$('whoBtn').addEventListener('click', openPicker);

$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  $('btnSound').textContent = soundOn ? '🔊' : '🔇';
  $('btnSound').classList.toggle('on', soundOn);
  saveSoon();
});

$('btnBook').addEventListener('click', () => { renderBook(); $('book').classList.add('open'); });
$('bkClose').addEventListener('click', () => $('book').classList.remove('open'));
$('book').addEventListener('pointerdown', e => {
  e.stopPropagation();
  if(e.target === $('book')) $('book').classList.remove('open');
});

$('btnReset').addEventListener('click', () => {
  for(const k in store){ store[k].history = []; store[k].idx = -1; }
  score = 0;
  battery = BATT_START;
  updateBattery();
  GEN[mode]();
  renderCurrent();
  updateScore();
  saveSoon();
});

/* ---------------- go ---------------- */
initProfiles();
$('whoBtn').textContent = curProf.avatar;
$('bkWho').textContent = CHILD_NAME;
loadSave();
$('btnSound').textContent = soundOn ? '\u{1F50A}' : '\u{1F507}';
$('btnSound').classList.toggle('on', soundOn);
setTheme(theme);
setMode('read');
updateScore();
updateBattery();
if(profs.list.length > 1) openPicker();
updateBattery();
</script>
